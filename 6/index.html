<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1815">
<title>قهوه خونه مه آلود | منوی کافه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; user-select: none;
}

:root {
  --bg-darkest: #15110e;
  --bg-dark: #1c1815;
  --bg-card: rgba(34, 28, 23, 0.7);
  --bg-card-hover: rgba(42, 34, 27, 0.85);
  --border: rgba(180, 150, 110, 0.15);
  --border-strong: rgba(212, 165, 116, 0.4);
  --cream: #e8d4ba;
  --cream-bright: #f5e6d3;
  --caramel: #c9a574;
  --caramel-bright: #d4a574;
  --coffee: #6f4e37;
  --espresso: #3b2417;
  --accent-gold: #d4a574;
  --accent-amber: #e6b87d;
  --accent-warm: #ff9a56;
  --text-primary: #f0e0c8;
  --text-secondary: #a8907a;
  --text-muted: #6b5848;
  --shadow-deep: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
  --shadow-warm: 0 8px 24px -6px rgba(212, 165, 116, 0.25);
  --radius-md: 18px;
  --radius-lg: 26px;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

html, body { height: 100%; overflow: hidden; background: #0d0a08; }
body {
  font-family: 'Vazirmatn', sans-serif;
  color: var(--text-primary);
  background: var(--bg-darkest);
  display: flex; justify-content: center; align-items: center;
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
}

.phone {
  position: relative; width: 100%; max-width: 430px;
  height: 100dvh; max-height: 932px;
  overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1a1612 0%, #15110e 50%, #1c1815 100%);
}
@media (min-width: 500px) {
  .phone { border-radius: 44px; border: 1px solid rgba(180, 150, 110, 0.15); margin: 20px; box-shadow: 0 20px 60px -10px rgba(0,0,0,0.5); }
}

/* Fog canvas - covers entire viewport */
#fogCanvas {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; pointer-events: none;
}

/* Warm glow at bottom (suggests brewing coffee) */
.warm-glow {
  position: absolute; bottom: -20%; left: 50%;
  transform: translateX(-50%);
  width: 120%; height: 50%;
  background: radial-gradient(ellipse at center bottom, rgba(255, 154, 86, 0.15) 0%, rgba(212, 165, 116, 0.05) 40%, transparent 70%);
  pointer-events: none; z-index: 1;
  animation: warmPulse 6s ease-in-out infinite;
}
@keyframes warmPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* Vignette overlay for atmospheric depth */
.vignette {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 100%);
}

/* Header */
.header {
  position: relative; z-index: 10;
  padding: calc(env(safe-area-inset-top) + 18px) 20px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: linear-gradient(180deg, rgba(28, 24, 21, 0.8) 0%, transparent 100%);
}

.brand { display: flex; align-items: center; gap: 12px; }

.brand-logo {
  position: relative; width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--coffee) 0%, var(--espresso) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 8px 24px -4px rgba(111, 78, 55, 0.5), inset 0 2px 4px rgba(245, 230, 211, 0.15);
}
.brand-logo::after {
  content: ''; position: absolute; bottom: 70%; left: 50%;
  width: 4px; height: 4px; background: rgba(245, 230, 211, 0.4);
  border-radius: 50%; filter: blur(2px);
  box-shadow: -8px -8px 0 -1px rgba(245, 230, 211, 0.3), 8px -8px 0 -1px rgba(245, 230, 211, 0.3);
  animation: logoSteam 3s ease-in-out infinite;
}
@keyframes logoSteam {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.5; }
  50% { transform: translateX(-50%) translateY(-10px); opacity: 0.9; }
}

.brand-name {
  font-family: 'Lalezar', sans-serif; font-size: 20px; font-weight: 400;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--cream-bright) 0%, var(--caramel-bright) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; line-height: 1.1;
}
.brand-sub {
  font-size: 10.5px; color: var(--text-secondary); font-weight: 500;
}

.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(245, 230, 211, 0.05);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-primary);
  transition: all 0.2s var(--ease-spring); position: relative;
}
.icon-btn:active { transform: scale(0.88); background: rgba(212, 165, 116, 0.15); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .badge {
  position: absolute; top: -4px; left: -4px;
  min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--accent-warm); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; border: 2px solid var(--bg-darkest);
  transform: scale(0); transition: transform 0.3s var(--ease-spring);
}
.icon-btn .badge.show { transform: scale(1); }

/* Search */
.search { position: relative; z-index: 9; padding: 0 20px 12px; }
.search-field {
  position: relative; display: flex; align-items: center;
  background: rgba(34, 28, 23, 0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 0 14px; transition: all 0.25s var(--ease-smooth);
}
.search-field:focus-within {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
  background: rgba(42, 34, 27, 0.8);
}
.search-field svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
.search-field input {
  flex: 1; border: none; background: transparent; outline: none;
  color: var(--text-primary); font-family: inherit; font-size: 14px;
  padding: 11px 12px; font-weight: 500;
}
.search-field input::placeholder { color: var(--text-muted); }
.search-clear {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--text-muted); display: none;
  align-items: center; justify-content: center;
  color: var(--bg-darkest); font-size: 14px; font-weight: 700; cursor: pointer;
}
.search-field.has-text .search-clear { display: flex; }

/* Categories */
.categories {
  position: relative; z-index: 8; padding: 0 0 12px;
  display: flex; overflow-x: auto; scrollbar-width: none;
}
.categories::-webkit-scrollbar { display: none; }
.categories-inner { display: flex; gap: 8px; padding: 0 20px; }
.cat-pill {
  flex-shrink: 0;
  background: rgba(34, 28, 23, 0.7); backdrop-filter: blur(8px);
  border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s var(--ease-spring); white-space: nowrap;
}
.cat-pill:active { transform: scale(0.92); }
.cat-pill.active {
  background: linear-gradient(135deg, var(--coffee) 0%, var(--espresso) 100%);
  color: var(--cream-bright); border-color: var(--caramel);
  box-shadow: 0 6px 14px -2px rgba(111, 78, 55, 0.6), inset 0 1px 0 rgba(245, 230, 211, 0.2);
}

/* Menu */
.menu {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 4px 16px 24px;
  position: relative; z-index: 2;
  scrollbar-width: none;
}
.menu::-webkit-scrollbar { display: none; }

.menu-section { margin-bottom: 16px; }
.menu-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 800;
  color: var(--caramel-bright);
  padding: 6px 4px 12px; letter-spacing: 0.3px;
}
.menu-section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to left, transparent, var(--border));
}
.menu-section-count {
  font-size: 10.5px; color: var(--text-secondary); font-weight: 600;
  padding: 2px 9px; background: rgba(212, 165, 116, 0.08);
  border-radius: 999px;
}

/* Card */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px; margin-bottom: 10px;
  display: flex; gap: 12px; align-items: center;
  position: relative; box-shadow: var(--shadow-deep);
  cursor: pointer;
  transition: all 0.25s var(--ease-spring); overflow: visible;
}
.card:active {
  transform: scale(0.98); background: var(--bg-card-hover);
  border-color: var(--border-strong);
}
.card-emoji {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--coffee) 0%, var(--espresso) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; flex-shrink: 0;
  box-shadow: 0 6px 16px -4px rgba(111, 78, 55, 0.4), inset 0 2px 4px rgba(245, 230, 211, 0.1);
  position: relative;
  transition: transform 0.3s var(--ease-spring);
}
.card:active .card-emoji { transform: scale(1.1) rotate(-5deg); }

.card-info { flex: 1; min-width: 0; }
.card-name-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 3px;
}
.card-name {
  font-size: 14.5px; font-weight: 800; color: var(--cream-bright);
  letter-spacing: -0.2px; line-height: 1.3;
}
.card-fav {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(245, 230, 211, 0.04);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s var(--ease-spring);
}
.card-fav:active { transform: scale(0.85); }
.card-fav svg { width: 15px; height: 15px; color: var(--text-muted); transition: all 0.25s; }
.card-fav.active {
  background: rgba(255, 154, 86, 0.12);
  border-color: rgba(255, 154, 86, 0.4);
}
.card-fav.active svg { color: var(--accent-warm); fill: var(--accent-warm); transform: scale(1.15); }

.card-tag {
  display: inline-flex; font-size: 9px; font-weight: 800;
  padding: 2px 8px; border-radius: 999px; letter-spacing: 0.3px;
  background: linear-gradient(135deg, var(--accent-amber) 0%, var(--caramel) 100%);
  color: var(--espresso); margin-bottom: 2px;
}
.card-tag.special {
  background: linear-gradient(135deg, var(--accent-warm) 0%, #d4651b 100%); color: #fff;
}
.card-tag.new {
  background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%); color: #fff;
}

.card-desc {
  font-size: 11.5px; color: var(--text-secondary);
  line-height: 1.45; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; font-weight: 500;
}
.card-bottom {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.card-price { display: flex; align-items: baseline; gap: 3px; }
.price-value {
  font-size: 15px; font-weight: 800;
  color: var(--caramel-bright); font-variant-numeric: tnum;
}
.price-unit { font-size: 9.5px; color: var(--text-muted); font-weight: 600; }

.card-add-btn {
  padding: 7px 14px 7px 12px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent-amber) 0%, var(--caramel) 100%);
  color: var(--espresso); font-family: inherit;
  font-size: 11.5px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  box-shadow: 0 4px 10px -2px rgba(212, 165, 116, 0.4);
  transition: all 0.2s var(--ease-spring);
}
.card-add-btn:active { transform: scale(0.92); }
.card-add-btn.added {
  background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%); color: #fff;
  box-shadow: 0 4px 10px -2px rgba(74, 222, 128, 0.4);
}

/* Toast */
.toast {
  position: absolute; top: calc(env(safe-area-inset-top) + 80px);
  left: 50%; transform: translateX(-50%) translateY(-30px); z-index: 200;
  background: rgba(34, 28, 23, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  padding: 10px 18px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; color: var(--cream-bright);
  display: flex; align-items: center; gap: 6px;
  box-shadow: var(--shadow-deep);
  opacity: 0; transition: all 0.35s var(--ease-spring);
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Heart burst */
.heart-burst { position: fixed; pointer-events: none; z-index: 150; }
.heart-particle {
  position: absolute; font-size: 16px; opacity: 0;
  animation: heartBurst 0.8s var(--ease-smooth) forwards;
}
@keyframes heartBurst {
  0% { opacity: 1; transform: translate(0,0) scale(0.5); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5); }
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(212, 165, 116, 0.3);
  transform: scale(0);
  animation: rippleEffect 0.6s var(--ease-smooth); pointer-events: none;
}
@keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

/* FAB */
.fab {
  position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px);
  left: 50%; transform: translateX(-50%); z-index: 50;
  background: linear-gradient(135deg, var(--accent-amber) 0%, var(--caramel) 100%);
  color: var(--espresso); border: none; padding: 12px 22px;
  border-radius: 999px; font-family: inherit;
  font-size: 13px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 28px -6px rgba(212, 165, 116, 0.5);
  transition: all 0.3s var(--ease-spring);
}
.fab:active { transform: translateX(-50%) scale(0.95); }
.fab.hidden { transform: translateX(-50%) translateY(120%); opacity: 0; pointer-events: none; }
.fab-count {
  background: rgba(59, 36, 23, 0.25); padding: 2px 8px;
  border-radius: 999px; font-size: 11px; font-weight: 800;
  min-width: 18px; text-align: center;
}
.fab-count.bump { animation: countBump 0.4s var(--ease-spring); }
@keyframes countBump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

.empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
.empty-state-icon { font-size: 64px; margin-bottom: 14px; display: inline-block; animation: cupBob 3s ease-in-out infinite; }
@keyframes cupBob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}
.empty-state-text { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.empty-state-sub { font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="phone" id="phone">
  <canvas id="fogCanvas"></canvas>
  <div class="warm-glow"></div>
  <div class="vignette"></div>

  <header class="header">
    <div class="brand">
      <div class="brand-logo">☕</div>
      <div>
        <div class="brand-name">قهوه خونه</div>
        <div class="brand-sub">کافه مه‌آلود، صبح‌های ابری</div>
      </div>

    <button class="icon-btn" id="favBtn" aria-label="علاقه‌مندی‌ها">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="badge" id="favBadge">۰</span>
    </button>
  </header>

  <div class="search">
    <div class="search-field" id="searchField">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="جستجوی نوشیدنی..." autocomplete="off">
      <div class="search-clear" id="searchClear">✕</div>
    </div>
  </div>

  <nav class="categories">
    <div class="categories-inner" id="categoriesInner"></div>
  </nav>

  <main class="menu" id="menu"></main>

  <button class="fab hidden" id="fab">
    <span>سفارش‌ها</span>
    <span class="fab-count" id="fabCount">۰</span>
  </button>

  <div class="toast" id="toast"><span id="toastText">متن</span></div>
</div>

    { id: 24, cat: 'tea', name: 'دمنوش بابونه', desc: 'دمنوش آرام‌بخش بابونه با کمی عسل', price: 32000, emoji: '🍵' },
    { id: 25, cat: 'tea', name: 'چای سیاه با هل', desc: 'چای سیاه با هل و کمی نبات', price: 28000, emoji: '🍵' }

};

const state = {
  favorites: new Set(),
  activeCategory: 'all',
  searchQuery: '',
  orderCount: 0
};

const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n) { return String(n).replace(/\d/g, d => faDigits[d]); }
function formatPrice(n) { return toFa(n.toLocaleString('en-US')); }

function renderCategories() {
  const wrap = document.getElementById('categoriesInner');
  wrap.innerHTML = '';
  menuData.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (state.activeCategory === cat.id ? ' active' : '');
    btn.innerHTML = `<span>${cat.emoji}</span>${cat.name}`;
    btn.addEventListener('click', () => {
      state.activeCategory = cat.id;
      renderCategories(); renderMenu();
    });
    wrap.appendChild(btn);
  });
}

function renderMenu() {
  const wrap = document.getElementById('menu');
  let items = menuData.items;
  if (state.activeCategory !== 'all') items = items.filter(i => i.cat === state.activeCategory);
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    items = items.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q));
  }
  if (items.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">☕</div><div class="empty-state-text">موردی یافت نشد</div><div class="empty-state-sub">نوشیدنی دیگری را امتحان کنید</div></div>';
    return;
  }
  if (state.activeCategory === 'all' && !state.searchQuery) {
    wrap.innerHTML = '';
    menuData.categories.forEach(cat => {
      if (cat.id === 'all') return;
      const groupItems = items.filter(i => i.cat === cat.id);
      if (groupItems.length === 0) return;
      const section = document.createElement('div');
      section.className = 'menu-section';
      section.innerHTML = `<div class="menu-section-title"><span>${cat.emoji}</span><span>${cat.name}</span><span class="menu-section-count">${toFa(groupItems.length)} مورد</span></div>`;
      groupItems.forEach(item => section.appendChild(createCard(item)));
      wrap.appendChild(section);
    });
  } else {
    wrap.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'menu-section';
    items.forEach(item => section.appendChild(createCard(item)));
    wrap.appendChild(section);
  }
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  const isFav = state.favorites.has(item.id);
  let tagHtml = '';
  if (item.tag) {
    const tagClass = item.tagType ? item.tagType : '';
    tagHtml = `<div class="card-tag ${tagClass}">${item.tag}</div>`;
  }
  card.innerHTML = `
    <div class="card-emoji">${item.emoji}</div>
    <div class="card-info">
      ${tagHtml}
      <div class="card-name-row">
        <div class="card-name">${item.name}</div>
        <button class="card-fav ${isFav ? 'active' : ''}" data-action="fav">
          <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-bottom">
        <div class="card-price">
          <span class="price-value">${formatPrice(item.price)}</span>
          <span class="price-unit">تومان</span>
        </div>
        <button class="card-add-btn" data-action="add">
          <span style="font-size:14px;font-weight:900">+</span>
          <span>افزودن</span>
        </button>
      </div>
    </div>
  `;
  const favBtn = card.querySelector('[data-action="fav"]');
  favBtn.addEventListener('click', e => { e.stopPropagation(); toggleFav(item, favBtn, e); rippleEffect(e); });
  const addBtn = card.querySelector('[data-action="add"]');
  addBtn.addEventListener('click', e => { e.stopPropagation(); handleAdd(item, addBtn, e); rippleEffect(e); });
  return card;
}

function toggleFav(item, btn, e) {
  if (state.favorites.has(item.id)) {
    state.favorites.delete(item.id);
    btn.classList.remove('active');
    btn.querySelector('svg').setAttribute('fill', 'none');
    showToast('از علاقه‌مندی حذف شد', '💔');
  } else {
    state.favorites.add(item.id);
    btn.classList.add('active');
    btn.querySelector('svg').setAttribute('fill', 'currentColor');
    heartBurst(btn, e);
    showToast('به علاقه‌مندی اضافه شد', '❤️');
  }
  updateFavBadge();
}

function updateFavBadge() {
  const badge = document.getElementById('favBadge');
  const count = state.favorites.size;
  badge.textContent = toFa(count);
  if (count > 0) badge.classList.add('show');
  else badge.classList.remove('show');
}

function handleAdd(item, btn, e) {
  state.orderCount++;
  const fab = document.getElementById('fab');
  const fabCount = document.getElementById('fabCount');
  fab.classList.remove('hidden');
  fabCount.textContent = toFa(state.orderCount);
  fabCount.classList.remove('bump'); void fabCount.offsetWidth;
  fabCount.classList.add('bump');
  btn.classList.add('added');
  const original = btn.innerHTML;
  btn.innerHTML = '<span>✓</span><span>افزوده شد</span>';
  setTimeout(() => { btn.classList.remove('added'); btn.innerHTML = original; }, 1200);
  if (navigator.vibrate) navigator.vibrate(15);
  showToast(`${item.name} اضافه شد`, '☕');
}

document.getElementById('fab').addEventListener('click', () => {
  showToast(`${toFa(state.orderCount)} نوشیدنی در سفارش`, '🛒');
});
document.getElementById('favBtn').addEventListener('click', () => {
  const count = state.favorites.size;
  showToast(count === 0 ? 'علاقه‌مندی خالی است' : `${toFa(count)} نوشیدنی در علاقه‌مندی`, '❤️');
});

function heartBurst(element, e) {
  const rect = element.getBoundingClientRect();
  const burst = document.createElement('div');
  burst.className = 'heart-burst';
  burst.style.left = (rect.left + rect.width/2) + 'px';
  burst.style.top = (rect.top + rect.height/2) + 'px';
  for (let i = 0; i < 8; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart-particle';
    heart.textContent = ['❤️', '💕', '✨', '☕'][i % 4];
    const angle = (i / 8) * Math.PI * 2;
    const distance = 30 + Math.random() * 20;
    heart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
    heart.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
    heart.style.animationDelay = (i * 0.02) + 's';
    burst.appendChild(heart);
  }
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 1000);
}

let toastTimer;
function showToast(text, icon) {
  const toast = document.getElementById('toast');
  toast.innerHTML = icon ? `<span>${icon}</span><span>${text}</span>` : `<span>${text}</span>`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function rippleEffect(e, target) {
  const el = target || e.currentTarget;
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  let x = rect.width/2 - size/2, y = rect.height/2 - size/2;
  if (e.clientX !== undefined) {
    x = e.clientX - rect.left - size/2;
    y = e.clientY - rect.top - size/2;
  }
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.style.position = el.style.position || 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// Search
const searchInput = document.getElementById('searchInput');
const searchField = document.getElementById('searchField');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', e => {
  state.searchQuery = e.target.value.trim();
  if (state.searchQuery) searchField.classList.add('has-text');
  else searchField.classList.remove('has-text');
  if (state.activeCategory !== 'all') {
    state.activeCategory = 'all';
    renderCategories();
  }
  renderMenu();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  state.searchQuery = '';
  searchField.classList.remove('has-text');
  renderMenu();
  searchInput.focus();
});

// ============================================
// FOG CANVAS - billowing mist throughout viewport
// ============================================
const canvas = document.getElementById('fogCanvas');
const ctx = canvas.getContext('2d');
let canvasW, canvasH;
let fogClouds = [];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const phone = document.getElementById('phone');
  canvasW = phone.clientWidth;
  canvasH = phone.clientHeight;
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  setupFog();
}

function setupFog() {
  fogClouds = [];
  // Layer 1: Background fog (slow, large, low opacity)
  for (let i = 0; i < 6; i++) {
    fogClouds.push(createFog({
      sizeBase: 180,
      sizeRange: 80,
      speedBase: 0.15,
      speedRange: 0.1,
      opacityBase: 0.04,
      opacityRange: 0.04,
      directionBias: -1, // drift up
      hueBase: 30,
      hueRange: 10
    }));
  }
  // Layer 2: Mid layer (medium speed, medium opacity)
  for (let i = 0; i < 8; i++) {
    fogClouds.push(createFog({
      sizeBase: 120,
      sizeRange: 60,
      speedBase: 0.3,
      speedRange: 0.2,
      opacityBase: 0.06,
      opacityRange: 0.05,
      directionBias: -1,
      hueBase: 25,
      hueRange: 15
    }));
  }
  // Layer 3: Foreground (faster, more visible)
  for (let i = 0; i < 10; i++) {
    fogClouds.push(createFog({
      sizeBase: 80,
      sizeRange: 50,
      speedBase: 0.5,
      speedRange: 0.3,
      opacityBase: 0.08,
      opacityRange: 0.06,
      directionBias: -1,
      hueBase: 20,
      hueRange: 20
    }));
  }
  // Some side-drifting clouds for variety
  for (let i = 0; i < 4; i++) {
    fogClouds.push(createFog({
      sizeBase: 140,
      sizeRange: 60,
      speedBase: 0.2,
      speedRange: 0.15,
      opacityBase: 0.05,
      opacityRange: 0.04,
      directionBias: 0, // horizontal
      hueBase: 28,
      hueRange: 12,
      horizontal: true,
      horizontalDir: i % 2 === 0 ? 1 : -1
    }));
  }
}

function createFog(opts) {
  const size = opts.sizeBase + Math.random() * opts.sizeRange;
  const isHorizontal = opts.horizontal || false;
  let x, y;
  if (isHorizontal) {
    y = Math.random() * canvasH;
    x = opts.horizontalDir > 0 ? -size : canvasW + size;
  } else {
    x = Math.random() * canvasW;
    y = canvasH + Math.random() * 100;
  }
  return {
    x: x,
    y: y,
    size: size,
    initialSize: size,
    speed: opts.speedBase + Math.random() * opts.speedRange,
    opacity: opts.opacityBase + Math.random() * opts.opacityRange,
    initialOpacity: opts.opacityBase + Math.random() * opts.opacityRange,
    direction: isHorizontal ? opts.horizontalDir : 0,
    directionBias: opts.directionBias,
    horizontal: isHorizontal,
    hue: opts.hueBase + Math.random() * opts.hueRange,
    flickerOffset: Math.random() * Math.PI * 2,
    flickerSpeed: 0.001 + Math.random() * 0.002,
    drift: (Math.random() - 0.5) * 0.3,
    age: Math.random() * 1000, // stagger ages
    rotationOffset: Math.random() * Math.PI * 2
  };
}

function updateFog() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const time = Date.now();
  
  fogClouds.forEach(fog => {
    fog.age += 1;
    
    if (fog.horizontal) {
      fog.x += fog.speed * fog.direction;
      // Wrap around
      if (fog.direction > 0 && fog.x > canvasW + fog.size) {
        fog.x = -fog.size;
        fog.y = Math.random() * canvasH;
      } else if (fog.direction < 0 && fog.x < -fog.size) {
        fog.x = canvasW + fog.size;
        fog.y = Math.random() * canvasH;
      }
    } else {
      // Drift upward (and slightly horizontally)
      fog.y -= fog.speed;
      fog.x += fog.drift;
      
      // Subtle size pulsing (billowing effect)
      fog.size = fog.initialSize * (1 + Math.sin(time * 0.0005 + fog.flickerOffset) * 0.15);
      
      // Wrap to bottom when reaching top
      if (fog.y < -fog.size) {
        fog.y = canvasH + fog.size;
        fog.x = Math.random() * canvasW;
        fog.age = 0;
      }
    }
    
    // Opacity flicker
    const flicker = Math.sin(time * fog.flickerSpeed + fog.flickerOffset);
    const currentOpacity = fog.initialOpacity * (0.7 + flicker * 0.3);
    
    // Draw the fog cloud as a soft radial gradient
    const gradient = ctx.createRadialGradient(fog.x, fog.y, 0, fog.x, fog.y, fog.size);
    gradient.addColorStop(0, `hsla(${fog.hue}, 30%, 75%, ${currentOpacity})`);
    gradient.addColorStop(0.4, `hsla(${fog.hue}, 25%, 65%, ${currentOpacity * 0.6})`);
    gradient.addColorStop(0.8, `hsla(${fog.hue}, 20%, 55%, ${currentOpacity * 0.2})`);
    gradient.addColorStop(1, `hsla(${fog.hue}, 15%, 50%, 0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(fog.x, fog.y, fog.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  requestAnimationFrame(updateFog);
}

document.addEventListener('contextmenu', e => {
  if (e.target.closest('.card')) e.preventDefault();
});

function init() {
  resizeCanvas();
  updateFog();
  renderCategories();
  renderMenu();
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', init);
if (document.readyState === 'complete') init();
</script>
