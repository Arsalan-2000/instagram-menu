<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0706">
<title>جیگرکی اصیل | منوی کباب و جیگر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; user-select: none;
}

:root {
  --bg-darkest: #0a0706;
  --bg-dark: #14100c;
  --bg-card: #1f1812;
  --bg-card-hover: #2a2018;
  --border: rgba(255, 100, 50, 0.12);
  --border-strong: rgba(255, 120, 60, 0.4);
  --text-primary: #f5ebe0;
  --text-secondary: #b09888;
  --text-muted: #7a665a;
  --accent-ember: #ff6b1a;
  --accent-fire: #ff3d00;
  --accent-gold: #f7c948;
  --accent-deep: #d44310;
  --shadow-deep: 0 12px 32px -8px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 30px rgba(255, 60, 0, 0.3);
  --radius-md: 18px;
  --radius-lg: 26px;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

html, body { height: 100%; overflow: hidden; background: #000; }
body {
  font-family: 'Vazirmatn', sans-serif;
  color: var(--text-primary);
  background: var(--bg-darkest);
  display: flex; justify-content: center; align-items: center;
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
}

.phone {
  position: relative; width: 100%; max-width: 430px;
  height: 100dvh; max-height: 932px;
  overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg-darkest);
}
@media (min-width: 500px) {
  .phone { border-radius: 44px; border: 1px solid #2a2420; margin: 20px; }
}

/* Charcoal canvas */
#charcoalCanvas {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; pointer-events: none;
}

/* Warmth glow at bottom (intensifies with scroll) */
.warmth-glow {
  position: absolute; bottom: -30%; left: 50%;
  transform: translateX(-50%);
  width: 130%; height: 70%;
  background: radial-gradient(ellipse at center bottom, rgba(255, 60, 0, 0.2) 0%, rgba(255, 100, 50, 0.05) 40%, transparent 70%);
  pointer-events: none; z-index: 1;
  opacity: 0.2; transition: opacity 0.3s ease;
}

/* Header */
.header {
  position: relative; z-index: 10;
  padding: calc(env(safe-area-inset-top) + 18px) 20px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: linear-gradient(180deg, rgba(20, 16, 12, 0.95) 0%, rgba(20, 16, 12, 0.5) 80%, transparent 100%);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}

.brand { display: flex; align-items: center; gap: 12px; }

.brand-logo {
  position: relative; width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-ember) 0%, var(--accent-fire) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 8px 24px -4px rgba(255, 60, 0, 0.6), inset 0 2px 4px rgba(255, 220, 180, 0.3);
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 8px 24px -4px rgba(255, 60, 0, 0.6), inset 0 2px 4px rgba(255, 220, 180, 0.3); }
  50% { box-shadow: 0 8px 30px -2px rgba(255, 100, 50, 0.9), inset 0 2px 4px rgba(255, 220, 180, 0.5); }
}

.brand-name {
  font-family: 'Lalezar', sans-serif; font-size: 20px; font-weight: 400;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-ember) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.brand-sub {
  font-size: 10.5px; color: var(--text-secondary); font-weight: 500;
}

.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255, 220, 180, 0.04);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-primary);
  transition: all 0.2s var(--ease-spring); position: relative;
}
.icon-btn:active { transform: scale(0.88); background: rgba(255, 100, 50, 0.15); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .badge {
  position: absolute; top: -4px; left: -4px;
  min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--accent-fire); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; border: 2px solid var(--bg-darkest);
  transform: scale(0); transition: transform 0.3s var(--ease-spring);
}
.icon-btn .badge.show { transform: scale(1); }

/* Categories */
.categories {
  position: relative; z-index: 8;
  padding: 0 0 12px;
  display: flex; overflow-x: auto;
  scrollbar-width: none;
}
.categories::-webkit-scrollbar { display: none; }
.categories-inner { display: flex; gap: 8px; padding: 0 20px; }

.cat-pill {
  flex-shrink: 0;
  background: rgba(31, 24, 18, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 999px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s var(--ease-spring);
  white-space: nowrap;
}
.cat-pill:active { transform: scale(0.92); }
.cat-pill.active {
  background: linear-gradient(135deg, var(--accent-ember) 0%, var(--accent-fire) 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 14px -2px rgba(255, 60, 0, 0.6);
}

/* Menu */
.menu {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 4px 16px 40px;
  position: relative; z-index: 2;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.menu::-webkit-scrollbar { display: none; }

.menu-section { margin-bottom: 16px; }
.menu-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 800;
  color: var(--accent-ember);
  padding: 6px 4px 12px; letter-spacing: 0.3px;
}
.menu-section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to left, transparent, var(--border));
}
.menu-section-count {
  font-size: 10.5px; color: var(--text-secondary); font-weight: 600;
  padding: 2px 9px; background: rgba(255, 100, 50, 0.08);
  border-radius: 999px;
}

/* Card */
.card {
  background: rgba(31, 24, 18, 0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px; margin-bottom: 10px;
  display: flex; gap: 12px; align-items: center;
  position: relative; box-shadow: var(--shadow-deep);
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
  overflow: visible;
}
.card:active {
  transform: scale(0.98);
  background: rgba(42, 32, 24, 0.9);
  border-color: var(--border-strong);
}

.card-emoji {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #2a1810 0%, #1a0f08 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; flex-shrink: 0;
  box-shadow: 0 6px 16px -4px rgba(255, 60, 0, 0.3), inset 0 0 0 1px rgba(255, 100, 50, 0.2);
  position: relative;
  transition: transform 0.3s var(--ease-spring);
}
.card:active .card-emoji { transform: scale(1.1) rotate(-5deg); }

.card-emoji::before {
  /* grill marks */
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background:
    linear-gradient(0deg, transparent 30%, rgba(0,0,0,0.4) 32%, rgba(0,0,0,0.4) 34%, transparent 36%),
    linear-gradient(0deg, transparent 60%, rgba(0,0,0,0.4) 62%, rgba(0,0,0,0.4) 64%, transparent 66%);
  opacity: 0.6;
}

.card-info { flex: 1; min-width: 0; }
.card-name-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 3px;
}
.card-name {
  font-size: 14.5px; font-weight: 800; color: var(--text-primary);
  letter-spacing: -0.2px; line-height: 1.3;
}

.card-fav {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255, 220, 180, 0.04);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s var(--ease-spring);
}
.card-fav:active { transform: scale(0.85); }
.card-fav svg { width: 15px; height: 15px; color: var(--text-muted); transition: all 0.25s; }
.card-fav.active {
  background: rgba(255, 60, 0, 0.12);
  border-color: rgba(255, 60, 0, 0.4);
}
.card-fav.active svg { color: var(--accent-fire); fill: var(--accent-fire); transform: scale(1.15); }

.card-tag {
  display: inline-flex; font-size: 9px; font-weight: 800;
  padding: 2px 8px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-ember) 100%);
  color: #1a0f08; margin-bottom: 2px; letter-spacing: 0.3px;
}
.card-tag.special {
  background: linear-gradient(135deg, var(--accent-fire) 0%, var(--accent-deep) 100%);
  color: #fff;
}
.card-tag.new {
  background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%); color: #fff;
}

.card-desc {
  font-size: 11.5px; color: var(--text-secondary);
  line-height: 1.45; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; font-weight: 500;
}

.card-bottom {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.card-price { display: flex; align-items: baseline; gap: 3px; }
.price-value {
  font-size: 15px; font-weight: 800;
  color: var(--accent-ember); font-variant-numeric: tnum;
}
.price-unit { font-size: 9.5px; color: var(--text-muted); font-weight: 600; }

.card-add-btn {
  padding: 7px 14px 7px 12px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent-ember) 0%, var(--accent-fire) 100%);
  color: #fff; font-family: inherit; font-size: 11.5px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 4px;
  box-shadow: 0 4px 10px -2px rgba(255, 60, 0, 0.5);
  transition: all 0.2s var(--ease-spring);
}
.card-add-btn:active { transform: scale(0.92); }
.card-add-btn.added {
  background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%); color: #fff;
  box-shadow: 0 4px 10px -2px rgba(74, 222, 128, 0.4);
}

/* Toast */
.toast {
  position: absolute; top: calc(env(safe-area-inset-top) + 80px);
  left: 50%; transform: translateX(-50%) translateY(-30px);
  z-index: 200;
  background: rgba(31, 24, 18, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  padding: 10px 18px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 6px;
  box-shadow: var(--shadow-deep);
  opacity: 0; transition: all 0.35s var(--ease-spring);
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Heart burst */
.heart-burst { position: fixed; pointer-events: none; z-index: 150; }
.heart-particle {
  position: absolute; font-size: 16px; opacity: 0;
  animation: heartBurst 0.8s var(--ease-smooth) forwards;
}
@keyframes heartBurst {
  0% { opacity: 1; transform: translate(0,0) scale(0.5); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5); }
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255, 100, 50, 0.3);
  transform: scale(0);
  animation: rippleEffect 0.6s var(--ease-smooth);
  pointer-events: none;
}
@keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

/* FAB */
.fab {
  position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px);
  left: 50%; transform: translateX(-50%); z-index: 50;
  background: linear-gradient(135deg, var(--accent-ember) 0%, var(--accent-fire) 100%);
  color: #fff; border: none; padding: 12px 22px;
  border-radius: 999px; font-family: inherit;
  font-size: 13px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 28px -6px rgba(255, 60, 0, 0.6);
  transition: all 0.3s var(--ease-spring);
}
.fab:active { transform: translateX(-50%) scale(0.95); }
.fab.hidden { transform: translateX(-50%) translateY(120%); opacity: 0; pointer-events: none; }
.fab-count {
  background: rgba(0,0,0,0.25); padding: 2px 8px;
  border-radius: 999px; font-size: 11px; font-weight: 800;
  min-width: 18px; text-align: center;
}
.fab-count.bump { animation: countBump 0.4s var(--ease-spring); }
@keyframes countBump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

/* Heat meter (top corner, shows scroll progress as heat) */
.heat-meter {
  position: absolute; top: calc(env(safe-area-inset-top) + 75px);
  left: 20px; z-index: 9;
  display: flex; flex-direction: column; gap: 4px;
  pointer-events: none; opacity: 0.7;
}
.heat-label {
  font-size: 9.5px; color: var(--text-secondary);
  font-weight: 700; letter-spacing: 0.5px;
}
.heat-bar {
  width: 60px; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.08); overflow: hidden;
  border: 1px solid var(--border);
}
.heat-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #4a3c2a 0%, var(--accent-ember) 50%, var(--accent-fire) 100%);
  transition: width 0.15s ease;
  box-shadow: 0 0 8px rgba(255, 60, 0, 0.5);
}

.empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
.empty-state-icon { font-size: 64px; margin-bottom: 14px; display: inline-block; }
.empty-state-text { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.empty-state-sub { font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="phone" id="phone">
  <canvas id="charcoalCanvas"></canvas>
  <div class="warmth-glow" id="warmthGlow"></div>

  <header class="header">
    <div class="brand">
      <div class="brand-logo">🔥</div>
      <div>
        <div class="brand-name">جیگرکی اصیل</div>
        <div class="brand-sub">کباب و جیگر روی زغال، از ۱۳۵۰</div>
      </div>
    </div>
    <button class="icon-btn" id="favBtn" aria-label="علاقه‌مندی‌ها">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="badge" id="favBadge">۰</span>
    </button>
  </header>

  <div class="heat-meter">
    <span class="heat-label">حرارت زغال</span>
    <div class="heat-bar"><div class="heat-fill" id="heatFill"></div></div>
  </div>

  <nav class="categories">
    <div class="categories-inner" id="categoriesInner"></div>
  </nav>

  <main class="menu" id="menu"></main>

  <button class="fab hidden" id="fab">
    <span>سفارش‌ها</span>
    <span class="fab-count" id="fabCount">۰</span>
  </button>

  <div class="toast" id="toast"><span id="toastText">متن</span></div>
</div>

<script>
const menuData = {
  categories: [
    { id: 'all', name: 'همه', emoji: '🍖' },
    { id: 'jigar', name: 'جیگر و دل‌و‌قلوه', emoji: '🥩' },
    { id: 'kabab', name: 'کباب', emoji: '🍢' },
    { id: 'special', name: 'خوردنی‌های خاص', emoji: '🔥' },
    { id: 'rice', name: 'پلو', emoji: '🍚' }
  ],
  items: [
    { id: 1, cat: 'jigar', name: 'جیگر کبابی', desc: 'گوشت جیگر گوسفندی روی زغال با پیاز و آبلیمو تازه', price: 180000, emoji: '🥩', tag: 'ویژه', tagType: 'special' },
    { id: 2, cat: 'jigar', name: 'دل کبابی', desc: 'گوشت دل گوسفندی کبابی با ادویه مخصوص جیگرکی', price: 200000, emoji: '🥩' },
    { id: 3, cat: 'jigar', name: 'قلوه کبابی', desc: 'قلوه گوسفندی طعم‌دار شده روی آتش ملایم', price: 220000, emoji: '🥩' },
    { id: 4, cat: 'jigar', name: 'جیگر مرغ', desc: 'جیگر مرغ طعم‌دار با آبلیمو و فلفل سیاه', price: 120000, emoji: '🍗' },
    { id: 5, cat: 'jigar', name: 'دل‌و‌قلوه مخلوط', desc: 'ترکیب دل و قلوه گوسفندی با پیاز و خردل', price: 230000, emoji: '🥩', tag: 'محبوب' },
    { id: 6, cat: 'kabab', name: 'کباب کوبیده', desc: 'دو سیخ گوشت چرخ‌کرده گوسفندی با پیاز و طراویل', price: 240000, emoji: '🍢', tag: 'پرفروش' },
    { id: 7, cat: 'kabab', name: 'کباب برگ', desc: 'فیله گوسفندی گرم شده روی زغال با ادویه مخصوص', price: 320000, emoji: '🍖' },
    { id: 8, cat: 'kabab', name: 'کباب سلطانی', desc: 'ترکیب برگ و کوبیده، انتخاب پادشاهان ایرانی', price: 450000, emoji: '👑', tag: 'پادشاهی', tagType: 'special' },
    { id: 9, cat: 'kabab', name: 'جوجه کباب', desc: 'سینه مرغ ماریت شده در ماست و زعفران روی آتش', price: 280000, emoji: '🍗' },
    { id: 10, cat: 'kabab', name: 'کباب ماهیچه', desc: 'ران گوسفندی آرام پز با گوشت لطیف و طعم دودی', price: 350000, emoji: '🥩', tag: 'نفیس' },
    { id: 11, cat: 'special', name: 'کله پاچه', desc: 'کله و پاچه گوسفندی پخته شده با آب‌لیمو و ترخون', price: 350000, emoji: '🍲', tag: 'اصیل', tagType: 'special' },
    { id: 12, cat: 'special', name: 'سری سوخاری', desc: 'مغز گوسفندی سرخ شده با پیاز و ادویه مخصوص', price: 280000, emoji: '🥘' },
    { id: 13, cat: 'special', name: 'سوسیس کبابی', desc: 'سوسیس خانگی کبابی روی زغال با خردل و خیار', price: 190000, emoji: '🌭', tag: 'جدید', tagType: 'new' },
    { id: 14, cat: 'special', name: 'خرداد کباب', desc: 'کباب مخصوص خرداد با گوشت چرخ‌کرده و گردو', price: 380000, emoji: '🔥' },
    { id: 15, cat: 'rice', name: 'پلو با جیگر', desc: 'برنج طارم با جیگر کبابی و خلال زعفران', price: 260000, emoji: '🍚' },
    { id: 16, cat: 'rice', name: 'پلو با کباب', desc: 'برنج زعفرانی با کباب برگ و کره محلی', price: 340000, emoji: '🍚', tag: 'محبوب' }
  ]
};

const state = {
  favorites: new Set(),
  activeCategory: 'all',
  orderCount: 0,
  scrollProgress: 0
};

const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n) { return String(n).replace(/\d/g, d => faDigits[d]); }
function formatPrice(n) { return toFa(n.toLocaleString('en-US')); }

// ============================================
// RENDER
// ============================================
function renderCategories() {
  const wrap = document.getElementById('categoriesInner');
  wrap.innerHTML = '';
  menuData.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (state.activeCategory === cat.id ? ' active' : '');
    btn.innerHTML = `<span>${cat.emoji}</span>${cat.name}`;
    btn.addEventListener('click', () => {
      state.activeCategory = cat.id;
      renderCategories(); renderMenu();
    });
    wrap.appendChild(btn);
  });
}

function renderMenu() {
  const wrap = document.getElementById('menu');
  let items = menuData.items;
  if (state.activeCategory !== 'all') items = items.filter(i => i.cat === state.activeCategory);
  if (items.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔥</div><div class="empty-state-text">موردی یافت نشد</div><div class="empty-state-sub">دسته دیگری را امتحان کنید</div></div>';
    return;
  }
  if (state.activeCategory === 'all') {
    wrap.innerHTML = '';
    menuData.categories.forEach(cat => {
      if (cat.id === 'all') return;
      const groupItems = items.filter(i => i.cat === cat.id);
      if (groupItems.length === 0) return;
      const section = document.createElement('div');
      section.className = 'menu-section';
      section.innerHTML = `<div class="menu-section-title"><span>${cat.emoji}</span><span>${cat.name}</span><span class="menu-section-count">${toFa(groupItems.length)} مورد</span></div>`;
      groupItems.forEach(item => section.appendChild(createCard(item)));
      wrap.appendChild(section);
    });
  } else {
    wrap.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'menu-section';
    items.forEach(item => section.appendChild(createCard(item)));
    wrap.appendChild(section);
  }
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  const isFav = state.favorites.has(item.id);
  let tagHtml = '';
  if (item.tag) {
    const tagClass = item.tagType ? item.tagType : '';
    tagHtml = `<div class="card-tag ${tagClass}">${item.tag}</div>`;
  }
  card.innerHTML = `
    <div class="card-emoji">${item.emoji}</div>
    <div class="card-info">
      ${tagHtml}
      <div class="card-name-row">
        <div class="card-name">${item.name}</div>
        <button class="card-fav ${isFav ? 'active' : ''}" data-action="fav">
          <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-bottom">
        <div class="card-price">
          <span class="price-value">${formatPrice(item.price)}</span>
          <span class="price-unit">تومان</span>
        </div>
        <button class="card-add-btn" data-action="add">
          <span style="font-size:14px;font-weight:900">+</span>
          <span>افزودن</span>
        </button>
      </div>
    </div>
  `;
  const favBtn = card.querySelector('[data-action="fav"]');
  favBtn.addEventListener('click', e => { e.stopPropagation(); toggleFav(item, favBtn, e); rippleEffect(e); });
  const addBtn = card.querySelector('[data-action="add"]');
  addBtn.addEventListener('click', e => { e.stopPropagation(); handleAdd(item, addBtn, e); rippleEffect(e); });
  return card;
}

function toggleFav(item, btn, e) {
  if (state.favorites.has(item.id)) {
    state.favorites.delete(item.id);
    btn.classList.remove('active');
    btn.querySelector('svg').setAttribute('fill', 'none');
    showToast('از علاقه‌مندی حذف شد', '💔');
  } else {
    state.favorites.add(item.id);
    btn.classList.add('active');
    btn.querySelector('svg').setAttribute('fill', 'currentColor');
    heartBurst(btn, e);
    showToast('به علاقه‌مندی اضافه شد', '❤️');
  }
  updateFavBadge();
}

function updateFavBadge() {
  const badge = document.getElementById('favBadge');
  const count = state.favorites.size;
  badge.textContent = toFa(count);
  if (count > 0) badge.classList.add('show');
  else badge.classList.remove('show');
}

function handleAdd(item, btn, e) {
  state.orderCount++;
  const fab = document.getElementById('fab');
  const fabCount = document.getElementById('fabCount');
  fab.classList.remove('hidden');
  fabCount.textContent = toFa(state.orderCount);
  fabCount.classList.remove('bump'); void fabCount.offsetWidth;
  fabCount.classList.add('bump');
  btn.classList.add('added');
  const original = btn.innerHTML;
  btn.innerHTML = '<span>✓</span><span>افزوده شد</span>';
  setTimeout(() => { btn.classList.remove('added'); btn.innerHTML = original; }, 1200);
  if (navigator.vibrate) navigator.vibrate(15);
  showToast(`${item.name} اضافه شد`, '🔥');
}

document.getElementById('fab').addEventListener('click', () => {
  showToast(`${toFa(state.orderCount)} مورد در سفارش`, '🛒');
});
document.getElementById('favBtn').addEventListener('click', () => {
  const count = state.favorites.size;
  showToast(count === 0 ? 'علاقه‌مندی خالی است' : `${toFa(count)} مورد در علاقه‌مندی`, '❤️');
});

function heartBurst(element, e) {
  const rect = element.getBoundingClientRect();
  const burst = document.createElement('div');
  burst.className = 'heart-burst';
  burst.style.left = (rect.left + rect.width/2) + 'px';
  burst.style.top = (rect.top + rect.height/2) + 'px';
  for (let i = 0; i < 8; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart-particle';
    heart.textContent = ['❤️', '🔥', '✨', '🍖'][i % 4];
    const angle = (i / 8) * Math.PI * 2;
    const distance = 30 + Math.random() * 20;
    heart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
    heart.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
    heart.style.animationDelay = (i * 0.02) + 's';
    burst.appendChild(heart);
  }
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 1000);
}

let toastTimer;
function showToast(text, icon) {
  const toast = document.getElementById('toast');
  toast.innerHTML = icon ? `<span>${icon}</span><span>${text}</span>` : `<span>${text}</span>`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function rippleEffect(e, target) {
  const el = target || e.currentTarget;
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  let x = rect.width/2 - size/2, y = rect.height/2 - size/2;
  if (e.clientX !== undefined) {
    x = e.clientX - rect.left - size/2;
    y = e.clientY - rect.top - size/2;
  }
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.style.position = el.style.position || 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// ============================================
// CHARCOAL CANVAS - gets hotter with scroll
// ============================================
const canvas = document.getElementById('charcoalCanvas');
const ctx = canvas.getContext('2d');
let canvasW, canvasH;
let charcoals = [];
let embers = [];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const phone = document.getElementById('phone');
  canvasW = phone.clientWidth;
  canvasH = phone.clientHeight;
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  setupCharcoals();
}

function setupCharcoals() {
  charcoals = [];
  const charcoalCount = 38;
  for (let i = 0; i < charcoalCount; i++) {
    charcoals.push({
      x: (i / charcoalCount) * canvasW + (Math.random() - 0.5) * 30,
      y: canvasH - 10 - Math.random() * 70,
      size: 10 + Math.random() * 18,
      baseHeat: Math.random() * 0.25,
      flickerOffset: Math.random() * Math.PI * 2,
      flickerSpeed: 0.05 + Math.random() * 0.05,
      rotation: Math.random() * Math.PI,
      // irregular shape offsets
      bumps: Array(6).fill(0).map(() => 0.7 + Math.random() * 0.4)
    });
  }
}

function updateScrollProgress() {
  const menuEl = document.getElementById('menu');
  const maxScroll = menuEl.scrollHeight - menuEl.clientHeight;
  state.scrollProgress = maxScroll > 0 ? Math.min(1, Math.max(0, menuEl.scrollTop / maxScroll)) : 0;
  // Update UI elements
  document.getElementById('heatFill').style.width = (state.scrollProgress * 100) + '%';
  document.getElementById('warmthGlow').style.opacity = (0.2 + state.scrollProgress * 0.8);
}

function drawCharcoal(c, time) {
  const flicker = Math.sin(time * c.flickerSpeed + c.flickerOffset) * 0.08;
  const heat = Math.min(1, Math.max(0, state.scrollProgress * 0.85 + c.baseHeat + flicker));
  
  // Color based on heat
  // 0: dark gray (cool)
  // 0.5: dark red/orange
  // 1: bright orange-red (hot)
  const hue = 30 - heat * 25; // 30 (orange) to 5 (red)
  const sat = 30 + heat * 70; // 30 to 100
  const light = 5 + heat * 50; // 5 to 55
  const color = `hsl(${hue}, ${sat}%, ${light}%)`;
  const glowColor = `hsl(${hue}, 100%, ${30 + heat * 40}%)`;
  
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rotation);
  
  // Outer glow (intensifies with heat)
  if (heat > 0.1) {
    const glowRadius = c.size * (2 + heat * 4);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRadius);
    glow.addColorStop(0, `hsla(${hue}, 100%, ${40 + heat * 30}%, ${heat * 0.5})`);
    glow.addColorStop(0.5, `hsla(${hue}, 100%, 40%, ${heat * 0.2})`);
    glow.addColorStop(1, `hsla(${hue}, 100%, 30%, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Charcoal body (irregular shape)
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const r = c.size * c.bumps[i];
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  
  // Gradient: top brighter (hot spot), bottom darker
  const bodyGrad = ctx.createLinearGradient(0, -c.size, 0, c.size);
  bodyGrad.addColorStop(0, `hsl(${hue}, ${sat}%, ${light + heat * 15}%)`);
  bodyGrad.addColorStop(0.5, color);
  bodyGrad.addColorStop(1, `hsl(${hue}, ${sat * 0.8}%, ${light * 0.4}%)`);
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  
  // Bright hot spot on top (intensifies with heat)
  if (heat > 0.3) {
    const spotGrad = ctx.createRadialGradient(0, -c.size * 0.4, 0, 0, -c.size * 0.4, c.size * 0.7);
    spotGrad.addColorStop(0, `hsla(${hue + 10}, 100%, ${50 + heat * 30}%, ${heat * 0.7})`);
    spotGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
    ctx.fillStyle = spotGrad;
    ctx.beginPath();
    ctx.arc(0, -c.size * 0.4, c.size * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
  
  // Store color for embers
  c.hue = hue;
  c.heat = heat;
}

function spawnEmbers() {
  const spawnRate = state.scrollProgress * 0.6;
  charcoals.forEach(c => {
    if (c.heat > 0.2 && Math.random() < c.heat * spawnRate * 0.15) {
      embers.push({
        x: c.x + (Math.random() - 0.5) * c.size,
        y: c.y - c.size * 0.5,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -1 - Math.random() * 2,
        size: 1 + Math.random() * 2.5,
        life: 0,
        maxLife: 80 + Math.random() * 100,
        hue: c.hue + Math.random() * 15,
        initialHue: c.hue
      });
    }
  });
}

function updateEmbers() {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.life++;
    e.x += e.vx;
    e.y += e.vy;
    e.vx += (Math.random() - 0.5) * 0.05;
    e.vy *= 0.99;
    
    if (e.life > e.maxLife || e.y < -20) {
      embers.splice(i, 1);
      continue;
    }
    
    const lifeProgress = e.life / e.maxLife;
    const opacity = lifeProgress < 0.2 ? lifeProgress / 0.2 * 0.8 : (1 - lifeProgress) * 0.8;
    // Hue shifts from initial (orange) to red to dark red as it dies
    const hue = e.initialHue - lifeProgress * 20;
    
    const gradient = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.size * 3);
    gradient.addColorStop(0, `hsla(${hue}, 100%, 65%, ${opacity})`);
    gradient.addColorStop(0.5, `hsla(${hue}, 100%, 50%, ${opacity * 0.4})`);
    gradient.addColorStop(1, `hsla(${hue}, 100%, 40%, 0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function animate() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const time = Date.now() / 1000;
  
  // Draw charcoals
  charcoals.forEach(c => drawCharcoal(c, time));
  
  // Spawn and update embers
  spawnEmbers();
  updateEmbers();
  
  requestAnimationFrame(animate);
}

// Listen to scroll
document.getElementById('menu').addEventListener('scroll', updateScrollProgress);

document.addEventListener('contextmenu', e => {
  if (e.target.closest('.card')) e.preventDefault();
});

function init() {
  resizeCanvas();
  animate();
  renderCategories();
  renderMenu();
  updateScrollProgress();
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', init);
if (document.readyState === 'complete') init();
</script>
